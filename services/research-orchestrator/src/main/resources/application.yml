spring:
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:h2:file:./data/orchestrator;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
    username: sa
    password: ""
  sql:
    init:
      mode: never
  application:
    name: research-orchestrator
server:
  port: ${ORCHESTRATOR_PORT:8081}
market-research:
  providers:
    etsy-enabled: false
  services:
    analysis-base-url: ${ANALYSIS_BASE_URL:http://localhost:8082}
    content-base-url: ${CONTENT_BASE_URL:http://localhost:8083}
    archive-base-url: ${ARCHIVE_BASE_URL:http://localhost:8084}
